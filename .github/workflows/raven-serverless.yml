          cargo test --locked -p raven-node --test carrier_matrix -- --ignored --nocapture
      # docs/OFFLINE_GUIDE.md (Phase 3 P3.24) and docs/SAFETY_OFFLINE.md
      # (cutoff pack CP.15; its check folded in here by Phase 3 P3.C7): every
      # raven/ash line in their fenced blocks exists in this build's --help
      # with its flags, every gate they mark matches the const in raven-core
      # (a flipped gate fails here until the guides say so), "nothing to do"
      # appears only when nearby search is on, and the read-only OS commands
      # the offline guide names run on this runner. The self-test also runs
      # check_safety_offline.sh's. Debug build above (the script tries
      # raven.exe on Windows).
      - name: Offline and safety guides (docs/OFFLINE_GUIDE.md, docs/SAFETY_OFFLINE.md)
        # Its own evidence (LAN waiver amendment §5): it runs even when a
        # harness step before it failed.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash ../scripts/check_offline_guide.sh target/debug/raven --self-test
          bash ../scripts/check_offline_guide.sh target/debug/raven
      - name: ash doctor→send smoke (Windows terminal path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/ash_doctor_send_smoke.ps1'
          if (-not (Test-Path -LiteralPath $script)) {
            Write-Error "$script missing — refusing silent skip"
            exit 1
          }
          & $script
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ash / raven-node --help (terminal smoke)
        shell: pwsh
        run: |
          if (-not (Test-Path "target\debug\ash.exe")) { throw "missing target/debug/ash.exe" }
          if (-not (Test-Path "target\debug\raven-node.exe")) { throw "missing target/debug/raven-node.exe" }
          & ".\target\debug\ash.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "ash --help failed" }
          & ".\target\debug\raven-node.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "raven-node --help failed" }
          Write-Host "Windows terminal --help OK"
      - name: ash menu smoke
        shell: bash
        run: ./scripts/ash_menu_smoke.sh
      - name: PowerShell install script syntax check
        shell: pwsh
        run: |
          Get-Command Get-Content | Out-Null
          foreach ($p in @("scripts/install/windows_service.ps1", "scripts/install/windows_relay.ps1")) {
            if (-not (Test-Path $p)) { throw "missing $p" }
            # Parse-only: ensure script is well-formed PowerShell.
            # pwsh 7 requires [ref] targets to exist before ParseFile.
            $tokens = $null
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $p), [ref]$tokens, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { $_ }; throw "parse errors in $p" }
            Write-Host "$p OK"
          }
      - name: windows_service.ps1 exercise (temp dirs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $script)) { throw "missing $script" }
          $root = Join-Path $env:RUNNER_TEMP "raven-windows-service-exercise"
          $dataDir = Join-Path $root "data"
          $binDir = Join-Path $root "bin"
          try {
            New-Item -ItemType Directory -Force -Path $dataDir, $binDir | Out-Null
            # Write-Host is the information stream (6): keep its lines to check them.
            $lines = @(& (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -SkipScheduledTask 6>&1 | ForEach-Object { "$_" })
            $lines | ForEach-Object { Write-Host $_ }
            foreach ($name in @("raven-node.exe", "ash.exe", "raven.exe")) {
              $path = Join-Path $binDir $name
              if (-not (Test-Path -LiteralPath $path)) { throw "missing $path" }
              Write-Host "ok $path"
            }
            # Phase 3 P3.7: the LAN default follows `raven-node lan-default`; a
            # release build holds auto (LAN_AUTO_LISTEN_PRODUCTION_ENABLED, B12),
            # so the install stays on this PC.
            if ($lines -notcontains "lan-listen=127.0.0.1:7420") { throw "the release install did not print lan-listen=127.0.0.1:7420 (the B12 gate is closed)" }
            Write-Host "ok lan-listen=127.0.0.1:7420 (release build, gate closed)"
          } finally {
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      # Phase 3 P3.7: RAVEN_INSTALL_RENDER_ONLY=1 builds, copies, stops and registers
      # nothing and asks the raven-node.exe already in -BinDir for the LAN default. A
      # release build answers 127.0.0.1:7420 even with the lab switch set (inert in
      # release); a debug build with RAVEN_LAB_LAN_AUTO=1 answers auto, and the task's
      # arguments and the two Private-profile firewall rules follow. An invalid
      # -LanListen throws before anything is asked or built.
      - name: windows_service.ps1 LAN default (render-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $script)) { throw "missing $script" }
          $root = Join-Path $env:RUNNER_TEMP "raven-windows-service-render"
          $dataDir = Join-Path $root "data"
          $env:RAVEN_INSTALL_RENDER_ONLY = "1"
          $env:RAVEN_LAB_LAN_AUTO = "1"
          try {
            $lines = @(& (Resolve-Path $script) -DataDir $dataDir -BinDir "target\release" 6>&1 | ForEach-Object { "$_" })
            $lines | ForEach-Object { Write-Host $_ }
            if ($lines -notcontains "lan-listen=127.0.0.1:7420") { throw "release build: render-only did not resolve lan-listen=127.0.0.1:7420" }
            if (-not ($lines | Where-Object { $_ -like "service-args=*--lan-listen 127.0.0.1:7420 *" })) { throw "release build: the task's arguments lack --lan-listen 127.0.0.1:7420" }
            $lines = @(& (Resolve-Path $script) -DataDir $dataDir -BinDir "target\debug" 6>&1 | ForEach-Object { "$_" })
            $lines | ForEach-Object { Write-Host $_ }
            if ($lines -notcontains "lan-listen=auto") { throw "debug build with RAVEN_LAB_LAN_AUTO=1: render-only did not resolve lan-listen=auto" }
            if (-not ($lines | Where-Object { $_ -like "service-args=*--lan-listen auto *" })) { throw "debug build: the task's arguments lack --lan-listen auto" }
            if (-not ($lines | Where-Object { $_ -like '*New-NetFirewallRule -DisplayName "Raven LAN search"*-Protocol UDP -LocalPort 7420 -Profile Private' })) { throw "debug build: no Private-profile UDP rule for the LAN search" }
            $threw = $false
            try {
              & (Resolve-Path $script) -DataDir $dataDir -BinDir "target\release" -LanListen "0.0.0.0:7420 --relay" 6>&1 | Out-Null
            } catch {
              $threw = $true
              if ("$_" -notlike "*-LanListen must look like*") { throw "unexpected refusal: $_" }
              Write-Host "refused as expected: $_"
            }
            if (-not $threw) { throw "render-only accepted an invalid -LanListen" }
            if (Test-Path -LiteralPath $root) { throw "render-only created $root" }
            Write-Host "render-only LAN default OK (release 127.0.0.1:7420, debug lab auto, invalid -LanListen refused)"
          } finally {
            Remove-Item Env:\RAVEN_INSTALL_RENDER_ONLY -ErrorAction SilentlyContinue
            Remove-Item Env:\RAVEN_LAB_LAN_AUTO -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      # Upgrade path + task settings of the logon-task installer (never exercised by the
      # -SkipScheduledTask run above):
      #  * a running CLI session holds ash.exe open: Windows refuses to overwrite a running
      #    image but allows renaming it (FileShare.Delete models exactly that), so the
      #    installer must move it aside (ash.exe.old) instead of aborting on Copy-Item;
      #  * the task must register with no execution time limit (PT0S): the Task Scheduler
      #    default of 72h silently stops the always-on daemon after three days. A uniquely
      #    named task is registered with -NoStart and always unregistered.
      - name: windows_service.ps1 upgrade path + logon-task settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $script)) { throw "missing $script" }
          $root = Join-Path $env:RUNNER_TEMP "raven-windows-service-upgrade"
          $dataDir = Join-Path $root "data"
          $binDir = Join-Path $root "bin"
          $taskName = "RavenNodeBridgeCI-$PID"
          $hold = $null
          try {
            New-Item -ItemType Directory -Force -Path $dataDir, $binDir | Out-Null
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -SkipScheduledTask
            $ash = Join-Path $binDir "ash.exe"
            $hold = [System.IO.File]::Open($ash, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::Delete)
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -SkipScheduledTask
            if (-not (Test-Path -LiteralPath "$ash.old")) { throw "locked ash.exe was not moved aside to ash.exe.old" }
            if (-not (Test-Path -LiteralPath $ash)) { throw "ash.exe missing after upgrade over a locked copy" }
            $hold.Dispose()
            $hold = $null
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -TaskName $taskName -NoStart -InternetListen 127.0.0.1:7422
            $task = Get-ScheduledTask -TaskName $taskName
            # -InternetListen is opt-in and lands on the task's command line verbatim.
            $taskArgs = [string]$task.Actions[0].Arguments
            if ($taskArgs -notmatch '--internet-listen 127\.0\.0\.1:7422') { throw "task arguments lack --internet-listen: $taskArgs" }
            # P3.7: no -LanListen = `raven-node lan-default` of this release build (gate closed).
            if ($taskArgs -notmatch '--lan-listen 127\.0\.0\.1:7420 ') { throw "task arguments lack --lan-listen 127.0.0.1:7420: $taskArgs" }
            $limit = [string]$task.Settings.ExecutionTimeLimit
            if ($limit -ne "PT0S") { throw "ExecutionTimeLimit is '$limit', expected PT0S (no limit)" }
            if ($task.Settings.StartWhenAvailable -ne $true) { throw "StartWhenAvailable is not set" }
            if ([int]$task.Settings.RestartCount -lt 3) { throw "RestartCount is $($task.Settings.RestartCount), expected restart-on-failure" }
            if ([string]$task.State -eq "Running") { throw "-NoStart started the task" }
            Write-Host "logon task settings OK (PT0S, StartWhenAvailable, restart-on-failure, -InternetListen)"
            # Privacy pack PP.15: `raven lock` may leave the task disabled ("keep Raven
            # stopped"); a re-install is an explicit start and enables it again.
            Disable-ScheduledTask -TaskName $taskName | Out-Null
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -TaskName $taskName -NoStart
            $task = Get-ScheduledTask -TaskName $taskName
            if ([string]$task.State -eq "Disabled") { throw "a re-install left the disabled task disabled" }
            Write-Host "a re-install enables a task Lock disabled"
          } finally {
            if ($null -ne $hold) { $hold.Dispose() }
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      # The relay kit's Windows installer (docs/RELAY_KIT.md) on the debug build
      # with the lab unlock, under $env:RUNNER_TEMP: first binaries, kit.conf and
      # raven-relay.cmd only (-SkipScheduledTask); then an update that keeps
      # .prev copies and registers a uniquely named logon task without starting
      # it, whose action runs `relay --data-dir` with the 443 listener and never
      # the open-relay flag, with the same settings as windows_service.ps1. The
      # task is always unregistered.
      - name: windows_relay.ps1 exercise + logon-task settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "scripts/install/windows_relay.ps1"
          if (-not (Test-Path $script)) { throw "missing $script" }
          $root = Join-Path $env:RUNNER_TEMP "raven-windows-relay"
          $relayDir = Join-Path $root "relay"
          $binDir = Join-Path $root "bin"
          $taskName = "RavenRelayCI-$PID"
          try {
            $global:LASTEXITCODE = 0
            & (Resolve-Path $script) -RelayDir $relayDir -BinDir $binDir -Prebuilt target\debug -Lab -SkipScheduledTask
            if ($LASTEXITCODE -ne 0) { throw "windows_relay.ps1 -SkipScheduledTask exited $LASTEXITCODE" }
            foreach ($name in @("raven-node.exe", "raven.exe", "raven-relay.cmd", "kit.conf")) {
              $path = Join-Path $binDir $name
              if (-not (Test-Path -LiteralPath $path)) { throw "missing $path" }
              Write-Host "ok $path"
            }
            # The second run takes -Lab and the folder from kit.conf.
            & (Resolve-Path $script) -BinDir $binDir -Prebuilt target\debug -TaskName $taskName -NoStart
            if ($LASTEXITCODE -ne 0) { throw "windows_relay.ps1 -NoStart exited $LASTEXITCODE" }
            if (-not (Test-Path -LiteralPath (Join-Path $binDir "raven-node.exe.prev"))) { throw "the update kept no raven-node.exe.prev" }
            $task = Get-ScheduledTask -TaskName $taskName
            $line = "$($task.Actions[0].Execute) $($task.Actions[0].Arguments)"
            Write-Host "task action: $line"
            if ($line -notmatch 'relay --data-dir') { throw "task action lacks 'relay --data-dir': $line" }
            if ($line -notmatch '--also-tcp 443') { throw "task action lacks '--also-tcp 443': $line" }
            if ($line -notmatch 'RAVEN_LAB_TEST_A=1') { throw "kit.conf did not keep the lab setting: $line" }
            if ($line -match '--open') { throw "task action names the open-relay flag: $line" }
            $limit = [string]$task.Settings.ExecutionTimeLimit
            if ($limit -ne "PT0S") { throw "ExecutionTimeLimit is '$limit', expected PT0S (no limit)" }
            if ($task.Settings.StartWhenAvailable -ne $true) { throw "StartWhenAvailable is not set" }
            if ([int]$task.Settings.RestartCount -lt 3) { throw "RestartCount is $($task.Settings.RestartCount), expected restart-on-failure" }
            if ([string]$task.State -eq "Running") { throw "-NoStart started the task" }
            Write-Host "relay logon task settings OK (relay args, --also-tcp 443, PT0S, StartWhenAvailable, restart-on-failure)"
          } finally {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      - name: bootstrap manual-peer smoke
        shell: bash
        run: ./scripts/bootstrap_manual_peer_smoke.sh

  go-bridge:
    name: Go libp2p bridge security
    needs: tree-presence
    if: needs.tree-presence.outputs.libp2p_bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios-native/RAVEN/Libp2pBridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ios-native/RAVEN/Libp2pBridge/go.mod
          cache-dependency-path: ios-native/RAVEN/Libp2pBridge/go.sum
      - name: Unit, adversarial, and race tests
        run: go test -count=1 -race ./...
      - name: Vet
        run: go vet ./...

  ios-security:
    name: iOS protocol security tests
    needs: tree-presence
    if: needs.tree-presence.outputs.ios_app == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-native/RAVEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select an available iOS simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, d)
              for runtime, devices in data.items()
              for d in devices
              if d.get("isAvailable") and "iPhone" in d.get("name", "")
          ]
          if not candidates:
              raise SystemExit("no available iPhone simulator")
          # Runtime identifiers end in a dotted version with dashes. Prefer
          # the newest available runtime instead of relying on JSON order.
          def version(item):
              raw = item[0].rsplit("iOS-", 1)[-1]
              return tuple(int(part) for part in raw.split("-") if part.isdigit())
          print(max(candidates, key=version)[1]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and run protocol security tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project RAVEN.xcodeproj \
            -scheme RAVEN \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -parallel-testing-enabled NO \
            -only-testing:RAVENTests/RavenEnvelopeV1VectorsTests \
            -only-testing:RAVENTests/RavenServerlessLanPathTests \
            -only-testing:RAVENTests/RavenEnvelopeEndpointIngestTests \
            -only-testing:RAVENTests/RavenBleRvn1CarrierTests \
            -only-testing:RAVENTests/RavenEnvelopeChatWireTests \
            -only-testing:RAVENTests/ATSAMChainRatchetTests \
            -only-testing:RAVENTests/ATSAMIndexedSessionProfileTests \
            -only-testing:RAVENTests/ATSAMPairInitV1Tests \
            -only-testing:RAVENTests/ATSAMEndpointTransactionV1Tests \
            -only-testing:RAVENTests/ATSAMPairingRootAgreementTests \
            -only-testing:RAVENTests/RavenEnvelopeBridgeServiceTests \
            -only-testing:RAVENTests/MeshInteropVectorsTests \
            -only-testing:RAVENTests/RavenContactRequestV1Tests \
            -only-testing:RAVENTests/ContactRequestInboxTests \
            -only-testing:RAVENTests/RavenServerlessLanSettingsTests \
            -only-testing:RAVENTests/MessagingProductBoundaryTests
      - name: LAN handshake KAT + Release lab gate (scripted)
        run: bash ../../node/scripts/ios_lan_kat.sh
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
      - name: Prove XCTest host stayed offline
        run: |
          set -euo pipefail
          RESULT=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Logs/Test/*.xcresult' -type d -print0 \
            | xargs -0 stat -f '%m %N' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-)
          test -n "$RESULT"
          xcrun xcresulttool get test-results tests --path "$RESULT" \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          names = set()
          failures = []
          def walk(value):
              if isinstance(value, dict):
                  name = value.get("name")
                  if isinstance(name, str):
                      names.add(name)
                  status = value.get("testStatus") or value.get("status")
                  if isinstance(status, str) and status.lower() in {"failed", "failure"}:
                      failures.append(name or "unnamed test")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          required = {
              "testAppHostRecognizesXCTestAndSuppressesExternalSideEffects()",
              "testAppStartupNeverReachedAnExternalSideEffectBoundary()",
              "testRuntimeDetectorDoesNotDisableProductionShapedLaunch()",
          }
          missing = required - names
          if failures or missing:
              raise SystemExit(f"offline XCTest proof missing={sorted(missing)} failures={failures}")
          print("offline XCTest proof present")
          '
      - name: Release build (unsafe demo crypto must stay unavailable)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RAVEN.xcodeproj \
            -scheme RAVEN \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            CODE_SIGNING_ALLOWED=NO
