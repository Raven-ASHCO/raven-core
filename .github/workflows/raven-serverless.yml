        run: cargo clippy --locked -p raven-core --all-targets -- -D warnings
      # Phase 5 (P5.30): the WinRT nearby backend (src/nearby/winrt/) is
      # compiled only with feature nearby-radio: linted here on Windows.
      - name: clippy (raven-node nearby radio, Windows)
        run: cargo clippy --locked -p raven-node --all-targets --features nearby-radio -- -D warnings
      # bash, not the default pwsh: pwsh runs every line and the step takes only
      # the LAST command's exit code, so a failing `cargo test` above a passing
      # `cargo build` left the job green. --no-fail-fast: every test binary runs
      # (cargo otherwise stops at the first failing one) and the step still fails.
      - name: test raven-core + ash
        shell: bash
