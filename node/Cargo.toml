[workspace]
resolver = "2"
members = [
    "crates/raven-core",
    "crates/raven-mlkem768-incremental-ffi",
    "crates/raven-fb-ffi",
    "crates/raven-node",
    "crates/raven-swarm",
    "crates/ash",
    "crates/raven-client",
    "third_party/raven-sqlcipher-profile-guard",
]
default-members = ["crates/raven-core", "crates/raven-node", "crates/raven-swarm", "crates/ash"]
exclude = [
    "third_party/libsqlite3-sys-raven",
    "third_party/secret-service-2.0.2-raven-noprompt",
    "third_party/saturating-time-0.5.0-raven",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["RAVEN contributors"]

[workspace.dependencies]
raven-core = { path = "crates/raven-core" }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
bech32 = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
ml-kem = { version = "0.3", features = ["hazmat"] }
rand_core = "0.6"
snow = "0.9"

# Task 0A.2: single links="sqlite3" owner — audited fork with frozen SQLCipher 4.17.0.
[patch.crates-io]
libsqlite3-sys = { path = "third_party/libsqlite3-sys-raven" }
# Tor lab carrier (raven-tor-helper, feature `tor`): saturating-time 0.5.0 with the
# fix for arti#2726 (its limit search never ends on Windows, so Tor bootstrap
# hangs at 15 %). Drop this once a fixed crates.io release is in Cargo.lock.
saturating-time = { path = "third_party/saturating-time-0.5.0-raven" }
