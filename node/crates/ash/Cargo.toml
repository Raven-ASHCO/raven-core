[package]
name = "ash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RAVEN terminal CLI (product name ash) — local node control"

# Only for the desktop engine (raven-client), with the `engine` feature: see
# src/lib.rs. Named apart from the `ash` binary (no output-name clash).
[lib]
name = "ash_engine"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "ash"
path = "src/bin/ash.rs"

[[bin]]
name = "raven"
path = "src/bin/raven.rs"

# The offline release tool of the key ceremony (docs/RELEASE_KEY_CEREMONY.md,
# Phase 6 P6.46): built only with the non-default `release-tool` feature, so
# no shipped build contains it (node/scripts/release_tool_feature_audit.sh).
[[bin]]
name = "raven-release"
path = "src/bin/raven-release.rs"
required-features = ["release-tool"]

[[test]]
name = "release_tool"
path = "tests/release_tool.rs"
required-features = ["release-tool"]

[features]
default = []
# Explicit lab opt-in for the publicly-derivable pre-ATSAM demo cipher.
unsafe-demo-crypto = ["raven-core/unsafe-demo-crypto"]
# Local TRACE_* file logging only (requires RAVEN_TRACE_LOG). No ingest/curl.
# Forbidden in Release: compile_error! with exact diagnostic in trace_delivery.rs.
debug-trace-delivery = []
# The offline release tool (`raven-release`). Never enabled by a release build
# script or a CI release job.
release-tool = []
# The library target's bridge for the desktop engine (src/engine_bridge.rs).
engine = []

[dependencies]
raven-core = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
# Full-screen terminal app (src/tui/). Owner-approved exact pins: bump both
# together (ratatui 0.30.x re-exports crossterm 0.29 as ratatui::crossterm).
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }

[dev-dependencies]
tempfile = { workspace = true }
# MigratePolicy::Allow: tests seal temp profiles without the lab switch.
raven-core = { workspace = true, features = ["test-helpers"] }
